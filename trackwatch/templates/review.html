<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TrackWatch — Control Room (local only)</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --asphalt: #14181c; --asphalt-2: #1e252c; --blue: #1668c4; --blue-glow: #4a9de8;
    --gold: #ffb020; --green: #22b14c; --paper: #faf8f5; --ink: #12171b; --ink-soft: #5a656e;
    --rule: #d8d2c8; --red: #b23b1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: system-ui, -apple-system, sans-serif; line-height: 1.5;
  }
  header {
    background: var(--asphalt); color: #fff; padding: 1.1rem 1.5rem;
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.5rem; align-items: baseline; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header .badge { font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; color: var(--gold); text-transform: uppercase; }
  .counts { font-family: ui-monospace, Menlo, monospace; font-size: 0.82rem; color: #9caab5; }
  main { max-width: 980px; margin: 0 auto; padding: 1.5rem; }

  .eyebrow {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.72rem; font-weight: 800;
    letter-spacing: 0.08em; color: var(--blue); margin-bottom: 0.35rem;
  }

  .sweep-panel {
    background: #fff; border: 1px solid var(--rule); border-top: 5px solid var(--blue);
    border-radius: 4px; padding: 1.3rem 1.4rem; margin-bottom: 2rem;
    box-shadow: 0 5px 20px rgba(20, 24, 28, 0.05);
  }
  .sweep-top {
    display: flex; justify-content: space-between; gap: 1.5rem; align-items: flex-start;
  }
  .sweep-status { margin: 0; font-size: 1.55rem; }
  .sweep-status.clear::before { content: "✓ "; color: var(--green); }
  .sweep-status.attention::before { content: "! "; color: var(--gold); }
  .sweep-status.warning::before { content: "⚠ "; color: var(--red); }
  .sweep-status.neutral::before { content: "○ "; color: var(--ink-soft); }
  .sweep-subtext { margin: 0.3rem 0 0.3rem; color: var(--ink-soft); max-width: 620px; }
  .last-run { font-family: ui-monospace, Menlo, monospace; font-size: 0.76rem; color: #78838b; }

  .sweep-form {
    min-width: 230px; display: flex; flex-direction: column; gap: 0.4rem; align-items: stretch;
  }
  button {
    font-family: inherit; font-size: 0.9rem; font-weight: 700; padding: 0.58rem 1rem;
    border-radius: 3px; border: 1px solid transparent; cursor: pointer;
  }
  button:disabled { opacity: 0.65; cursor: wait; }
  button.run-sweep {
    background: var(--blue); color: #fff; padding: 0.72rem 1rem; box-shadow: 0 2px 0 #0d4d96;
  }
  button.run-sweep:hover { background: #0f5bae; }
  .run-note { font-size: 0.72rem; color: var(--ink-soft); text-align: center; }

  .sweep-stats {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.65rem; margin-top: 1.25rem;
  }
  .stat {
    background: #f3f0eb; border-radius: 4px; padding: 0.75rem; text-align: center;
  }
  .stat strong { display: block; font-size: 1.35rem; line-height: 1.2; }
  .stat span { display: block; color: var(--ink-soft); font-size: 0.72rem; margin-top: 0.15rem; }

  .sweep-details { margin-top: 1rem; border-top: 1px solid #e6e1da; padding-top: 0.8rem; }
  .sweep-details summary { color: var(--blue); cursor: pointer; font-size: 0.84rem; font-weight: 650; }
  .sweep-details pre {
    background: var(--asphalt-2); color: #dbe4ea; font-size: 0.76rem; padding: 0.8rem;
    border-radius: 3px; overflow: auto; white-space: pre-wrap; margin-bottom: 0;
  }


  .facebook-panel {
    background: #fff; border: 1px solid var(--rule); border-top: 5px solid #1877f2;
    border-radius: 4px; padding: 1.3rem 1.4rem; margin-bottom: 2rem;
    box-shadow: 0 5px 20px rgba(20, 24, 28, 0.05);
  }
  .facebook-panel-head {
    display: flex; justify-content: space-between; gap: 1rem; align-items: flex-start; margin-bottom: 1rem;
  }
  .facebook-panel h2 { margin: 0; font-size: 1.45rem; }
  .facebook-panel-head p { color: var(--ink-soft); margin: 0.3rem 0 0; max-width: 680px; }
  .facebook-badge {
    flex: 0 0 auto; font-family: ui-monospace, Menlo, monospace; font-size: 0.7rem;
    font-weight: 800; background: #eaf3ff; color: #125db7; border: 1px solid #bfd8f7;
    border-radius: 999px; padding: 0.35rem 0.6rem; white-space: nowrap;
  }
  .facebook-form {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem;
    padding-top: 1rem; border-top: 1px solid #e7e2da;
  }
  .facebook-form label { display: grid; gap: 0.3rem; }
  .facebook-form label > span { font-size: 0.78rem; font-weight: 800; color: #36434c; }
  .facebook-form small { font-weight: 500; color: var(--ink-soft); }
  .facebook-form input,
  .facebook-form select,
  .facebook-form textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff;
    border: 1px solid #cfc9bf; border-radius: 3px; padding: 0.62rem 0.7rem;
  }
  .facebook-form textarea { resize: vertical; min-height: 175px; line-height: 1.45; }
  .facebook-post { grid-column: 1 / -1; }

  .clipboard-box {
    display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
    align-self: end; min-height: 42px;
  }
  button.clipboard-btn {
    background: #1877f2; color: #fff; box-shadow: 0 2px 0 #0f56b1;
    padding: 0.62rem 0.85rem;
  }
  button.clipboard-btn:hover { background: #1269d3; }
  #clipboard-status { color: var(--ink-soft); font-size: 0.76rem; }
  #clipboard-status.ok { color: var(--green); font-weight: 700; }
  #clipboard-status.warn { color: var(--red); font-weight: 700; }
  .evidence-details {
    grid-column: 1 / -1; border-top: 1px solid #e7e2da; padding-top: 0.7rem;
  }
  .evidence-details summary {
    color: var(--blue); cursor: pointer; font-size: 0.82rem; font-weight: 750;
  }
  .evidence-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; margin-top: 0.75rem;
  }

  .facebook-form-foot {
    grid-column: 1 / -1; display: flex; justify-content: space-between;
    align-items: center; gap: 1rem; flex-wrap: wrap;
  }
  .facebook-form-foot p { color: var(--ink-soft); font-size: 0.78rem; margin: 0; max-width: 650px; }
  button.facebook-submit { background: #1877f2; color: #fff; box-shadow: 0 2px 0 #0f56b1; }
  button.facebook-submit:hover { background: #1269d3; }

  .queue-heading { margin-bottom: 1rem; }
  .queue-heading h2 { margin: 0; font-size: 1.35rem; }
  .queue-heading p { color: var(--ink-soft); margin: 0.25rem 0 0; }

  .card {
    background: #fff; border: 1px solid var(--rule); border-left: 5px solid var(--blue);
    border-radius: 0 4px 4px 0; padding: 1.2rem 1.4rem; margin-bottom: 1.4rem;
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.4rem; }
  .track { font-weight: 700; font-size: 1.05rem; text-transform: capitalize; }
  .source { color: var(--ink-soft); font-size: 0.85rem; margin-left: 0.5rem; }
  .confidence {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.75rem; color: #fff;
    background: var(--blue); padding: 0.2rem 0.5rem; border-radius: 3px;
  }
  .meta { margin: 0.4rem 0 0.6rem; font-size: 0.8rem; color: var(--ink-soft); display: flex; gap: 1rem; flex-wrap: wrap; }
  .change-type { text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700; color: var(--blue); }
  .summary { font-size: 1rem; margin: 0 0 0.8rem; }
  .conflict {
    background: #fdf0ea; border-left: 4px solid var(--red); padding: 0.6rem 0.9rem;
    margin-bottom: 0.9rem; font-size: 0.88rem; border-radius: 0 3px 3px 0;
  }
  .conflict ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
  .diff { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; margin-bottom: 0.8rem; }
  .diff h4 { margin: 0 0 0.3rem; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); }
  .diff pre {
    background: var(--asphalt-2); color: #dbe4ea; font-size: 0.78rem; padding: 0.7rem;
    border-radius: 3px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0;
  }
  .before pre { border-left: 3px solid var(--red); }
  .after pre { border-left: 3px solid var(--green); }
  .keywords { margin-bottom: 0.9rem; }
  .kw {
    display: inline-block; font-size: 0.7rem; background: #f0ece5; color: var(--ink-soft);
    padding: 0.15rem 0.45rem; border-radius: 3px; margin: 0 0.3rem 0.3rem 0;
  }
  .actions { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; }
  .actions form { margin: 0; }
  button.approve { background: var(--green); color: #fff; }
  button.ignore { background: #fff; color: var(--ink-soft); border-color: var(--rule); }
  .view-source { font-size: 0.85rem; color: var(--blue); margin-left: auto; }

  @media (max-width: 760px) {
    .sweep-top { flex-direction: column; }
    .facebook-panel-head { flex-direction: column; }
    .facebook-form { grid-template-columns: 1fr; }
    .facebook-post, .facebook-form-foot { grid-column: 1; }
    .evidence-details { grid-column: 1; }
    .evidence-grid { grid-template-columns: 1fr; }
    .sweep-form { width: 100%; }
    .sweep-stats { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 620px) {
    .diff { grid-template-columns: 1fr; }
    .view-source { margin-left: 0; }
    main { padding: 1rem; }
  }
</style>
</head>
<body>
<header>
  <h1>TrackWatch Control Room <span class="badge">private &middot; local only</span></h1>
  <div class="counts">{{PENDING_COUNT}} pending &middot; {{APPROVED_COUNT}} approved &middot; {{IGNORED_COUNT}} ignored</div>
</header>
<main>
{{SWEEP_PANEL}}
{{FACEBOOK_PANEL}}
{{QUEUE_HEADING}}
{{CARDS}}
</main>

<script>
(function () {
  const button = document.getElementById('paste-facebook');
  const textarea = document.getElementById('facebook-post-text');
  const status = document.getElementById('clipboard-status');
  const select = document.getElementById('facebook-track');

  if (!button || !textarea || !status || !select) return;

  function rememberTrack() {
    if (select.value) localStorage.setItem('trackwatch:lastFacebookTrack', select.value);
  }

  function restoreTrack() {
    const saved = localStorage.getItem('trackwatch:lastFacebookTrack');
    if (!saved) return;
    const option = Array.from(select.options).find(o => o.value === saved);
    if (option) select.value = saved;
  }

  function detectTrack(text) {
    const low = (text || '').toLowerCase();
    let best = null;
    for (const option of Array.from(select.options)) {
      if (!option.value) continue;
      const name = (option.dataset.trackName || option.textContent || '').trim().toLowerCase();
      if (name && low.includes(name)) {
        if (!best || name.length > best.name.length) best = { option, name };
      }
    }
    if (best) {
      select.value = best.option.value;
      rememberTrack();
      return best.option.textContent.trim();
    }
    return null;
  }

  restoreTrack();
  select.addEventListener('change', rememberTrack);

  button.addEventListener('click', async function () {
    button.disabled = true;
    status.className = '';
    status.textContent = 'Reading clipboard…';

    try {
      const response = await fetch('/clipboard', { cache: 'no-store' });
      const data = await response.json();

      if (!response.ok || !data.ok || !data.text) {
        throw new Error('Clipboard is empty or could not be read.');
      }

      textarea.value = data.text.trim();
      const detected = detectTrack(textarea.value);

      status.className = 'ok';
      status.textContent = detected
        ? `Pasted. Track detected: ${detected}`
        : 'Pasted. Choose the track, then Analyze Update.';
      textarea.focus();
    } catch (error) {
      status.className = 'warn';
      status.textContent = 'Could not read the clipboard. Paste into the box manually.';
      textarea.focus();
    } finally {
      button.disabled = false;
    }
  });
})();
</script>

</body>
</html>
