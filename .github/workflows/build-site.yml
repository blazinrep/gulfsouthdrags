name: Build generated site
on:
  push:
    branches: [main, feature/winners-circle]
    paths-ignore:
      - 'site/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          # On pull_request events checkout defaults to the merge commit in
          # detached HEAD, where `git push` fails ("not currently on a
          # branch"). Check out the PR branch head instead so the commit
          # step below can push back to the branch. Empty on push events,
          # where checkout defaults to the pushed ref.
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate website
        run: python3 build.py
      - name: Commit generated output if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          if ! git diff --cached --quiet; then
            git commit -m "Build generated site [skip ci]"
            git push
          fi
